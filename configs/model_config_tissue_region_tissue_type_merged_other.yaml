# Use with (everything below comes from this file -- no --segmentation/--label_mode/--num_classes
# needed):
#   python -u src/entrypoint/train_model.py \
#     --dataset gsdb --task inflammation --model_type gnn --architecture tissue_region_net \
#     --input_type graph --embedding_type pov-gigapath \
#     --graph_target_dir data/processed/graphs/gsdb/context_aware_domain_robust_labeled \
#     --cached --mil --seed 42 \
#     --config_name model_config_tissue_region_tissue_type_merged_other

common:
  deterministic: true
  mixed_precision: true
  save_frequency: 5
  gradient_clipping: 1.0
  seed: 42
  device: "cuda:0"
  fine_tuning:
    enabled: false
    pretrained_checkpoint: null
    strict_load: false
    freeze_all: false
    freeze_backbone: false
    freeze_feature_extractor: false
    freeze_layers: []
    trainable_layers: []
    unfreeze_backbone_epoch: null
    fine_tune_lr: null

dataset_settings:
  gsdb:
    label_mode: binary
    num_classes: 1
    negative_label_source: annotation_only

architectures:
  tissue_region_net:
    output_features: 160

inflammation:
  tissue_region_net:
    architecture:
      name: tissue_region_net
      pretrained: false
      feature_extraction: false
    label_mode: binary
    num_classes: 1
    use_segmentation_training: true
    batch_size: 1
    val_batch_size: 1
    grad_accum_steps: 1
    mixed_precision: true
    gradient_clipping: 1.0
    num_workers: 2
    pin_memory: true

    # --- Model hyperparameters (region branch) --
    dropout_rate: 0.35
    hidden_dim: 160
    num_layers: 3
    heads: 4
    edge_dropout_p: 0.10
    region_aux_weight: 0.0
    region_aux_pos_weight_cap: 6.0
    mixed_region_weight: 0.20

    # --- Model hyperparameters (patch branch) ---
    patch_hidden_dim: 160
    patch_num_layers: 2
    patch_aux_weight: 0.0
    patch_aux_pos_weight_cap: 6.0
    patch_edge_dropout_p: 0.10
    max_patch_nodes_for_full_forward: 600000
    max_patch_edges_for_full_forward: 8000000

    region_cls_target_field: tissue_type
    region_cls_class_names: [antrum, corpus, "other+intermediate"]
    region_cls_weight: 2.5
    patch_cls_target_field: tissue_type
    patch_cls_class_names: [antrum, corpus, "other+intermediate"]
    patch_cls_weight: 1.0

    graph_instance_norm: true
    use_edge_features: false

    k: 10
    normalize_pos: true
    epochs: 40
    in_dim: 1536
    auto_pos_weight: false
    balanced_sampling: false
    strict_graph_name_match: false
    resplit_large_regions: true
    resplit_target_patches_per_region: 250
    resplit_k_region: 5
    resplit_min_patches_per_region: 8
    train_augmentations:
      - name: feature_gaussian_noise
        std: 0.05
        node_types: [patch, region]
      - name: feature_dropout
        p: 0.1
        node_types: [patch, region]
      - name: feature_scale_noise
        std: 0.1
        node_types: [patch, region]
      - name: graph_mixstyle
        alpha: 0.1
        p: 0.4
        node_types: [patch, region]

    segmentation:
      target: region
      region_loss_weight: 0.0
      slide_loss_weight: 0.0
      patch_loss_weight: 0.0
      region_slide_consistency_weight: 0.0
      augmentation_consistency_weight: 0.0
      feature_consistency_weight: 0.0
      aux_loss_weight: 1.0
      fallback_region_weight: 0.20
      max_fallback_to_explicit_ratio: 0.75
      prefer_explicit_only_when_available: true
      slide_label_smoothing: 0.0
      unlabeled_region_policy: slide_aware
      sam_enabled: false
      sam_rho: 0.05
      monitor_metric: region_cls_macro_f1
      pseudo_label_top_fraction: 0.10
      pseudo_label_warmup_epochs: 15
      augmentation_consistency_p: 0.5
      augmentation_consistency_specs: []
      manifold_mixup_p: 0.0
      manifold_mixup_alpha: 0.4

    optimizer:
      name: AdamW
      learning_rate: 0.00008
      weight_decay: 0.003
      momentum: 0.9
    pos_weight: 1.0
    scheduler:
      enabled: true
      name: CosineAnnealingLR
      T_max: 30
    early_stopping:
      enabled: true
      patience: 8
      min_delta: 0.003
    fine_tuning:
      unfreeze_backbone_epoch: null
      fine_tune_lr: null
