# Stage 2 of a two-stage CAMELYON subtype pipeline (see git history: docs/experiments/camelyon_tumor_status.md
# "Fall A" for Stage 1, the existing binary tumor/no-tumor classifier -- already near-perfect,
# patch F1 ~0.95-0.98, region F1 1.0 -- via model_config_tissue_region_segmentation_region_
# monitorloss_pseudolabel). Stage 1 solves "is there tumor"; this config only tackles "how much"
# (itc vs micro vs macro extent) by training exclusively on tumor-POSITIVE slides
# (exclude_label_field_values drops every 'negative' slide from train/val/test entirely -- see
# WSICachedGraphDataset.exclude_label_field_values). Motivation: across every 4-way (itc/macro/
# micro/negative) run so far, itc/micro recall stayed poor (~0.17-0.60) despite loss-function
# tuning (class weights, focal loss with/without alpha -- see model_config_tissue_region_camelyon_
# subtype_cls.yaml's comments for the full trail), while the binary tumor signal was already
# solved -- decoupling "is it tumor" from "how much tumor" lets this head spend its whole capacity
# and gradient budget on the actually-hard 3-way distinction instead of also having to reject the
# much larger, already-separately-solved negative class.
#
# At inference, combine with Stage 1: predict negative when Stage 1 says no tumor, else use this
# head's itc/macro/micro prediction. No combining code exists yet -- write a small script that
# loads both checkpoints and applies this decision rule when ready to evaluate the full pipeline.
#
# Use with:
#   python -u src/entrypoint/train_model.py \
#     --dataset camelyon --task lymph --model_type gnn --architecture tissue_region_net \
#     --input_type graph --embedding_type pov-gigapath \
#     --graph_target_dir data/processed/graphs/camelyon/context_aware_camelyon_domain_robust_labels \
#     --cached --mil --seed 42 \
#     --config_name model_config_tissue_region_camelyon_subtype_extent_positive_only

common:
  deterministic: true
  mixed_precision: false
  save_frequency: 5
  gradient_clipping: 1.0
  seed: 42
  device: "cuda:0"
  fine_tuning:
    enabled: false
    pretrained_checkpoint: null
    strict_load: false
    freeze_all: false
    freeze_backbone: false
    freeze_feature_extractor: false
    freeze_layers: []
    trainable_layers: []
    unfreeze_backbone_epoch: null
    fine_tune_lr: null

dataset_settings:
  camelyon:
    label_mode: multiclass
    # 3 classes: itc/macro/micro. 'negative' is dropped entirely via exclude_label_field_values
    # below (not just given id 3 and never occurring, as the 4-way config's comment describes for
    # 'unknown' -- exclude_label_field_values uses the exact same graph-loading/vocab-lookup
    # mechanism as that 'unknown' filter, just matching a configurable set of class names instead
    # of the fixed 'unknown' marker; see WSICachedGraphDataset._resolve_label_field_is_excluded).
    num_classes: 3

architectures:
  tissue_region_net:
    output_features: 160

lymph:
  tissue_region_net:
    architecture:
      name: tissue_region_net
      pretrained: false
      feature_extraction: false
    label_mode: multiclass
    num_classes: 3
    label_field: subtype
    # The actual Stage 2 filter: drop every slide whose subtype resolves to 'negative' from
    # train/val/test alike (verified against the real test split: 98 resolvable graphs -> 37
    # remain, exactly 6 itc + 26 macro + 5 micro, 61 negative correctly excluded).
    exclude_label_field_values: [negative]
    batch_size: 1
    val_batch_size: 1
    grad_accum_steps: 4
    mixed_precision: false
    gradient_clipping: 1.0
    num_workers: 0

    dropout_rate: 0.45
    hidden_dim: 160
    num_layers: 3
    heads: 4
    edge_dropout_p: 0.30
    region_aux_weight: 0.25
    region_aux_pos_weight_cap: 6.0

    patch_hidden_dim: 160
    patch_num_layers: 3
    patch_aux_weight: 0.3
    patch_aux_pos_weight_cap: 6.0
    patch_edge_dropout_p: 0.30
    max_patch_nodes_for_full_forward: 6000
    max_patch_edges_for_full_forward: 150000
    graph_instance_norm: false
    # Even more directly relevant here than in the 4-way head: with 'negative' gone, this signal
    # (mean tumor-logit + positive-fraction at region/patch granularity) is exactly what should
    # separate itc (isolated cells, tiny positive-fraction) from macro (large positive-fraction).
    use_extent_features: true

    k: 10
    normalize_pos: true
    epochs: 80
    in_dim: 1536
    strict_graph_name_match: false
    train_augmentations:
      - name: feature_gaussian_noise
        std: 0.05
        node_types: [patch, region]
      - name: feature_dropout
        p: 0.1
        node_types: [patch, region]
      - name: feature_scale_noise
        std: 0.1
        node_types: [patch, region]
      - name: graph_mixstyle
        alpha: 0.2
        p: 0.4
        node_types: [patch, region]

    consistency_weight: 0.0
    consistency_specs: []
    consistency_p: 1.0
    domain_adversarial_weight: 0.0
    domain_adversarial_specs: []
    slide_label_smoothing: 0.0
    monitor_metric: kappa_quadratic
    # Same ordinal remap idea as the 4-way config, minus the now-absent negative class. Raw ids
    # (alphabetical: itc=0, macro=1, micro=2) -> clinical severity rank (itc=0 < micro=1 <
    # macro=2). Index i is class id i's rank.
    ordinal_class_order: [0, 2, 1]
    # Same reasoning as the 4-way config (WeightedRandomSampler actually increases how often the
    # model sees itc per epoch, not just how much its loss counts) -- kept true here too, now
    # oversampling itc within the smaller tumor-positive-only pool.
    balanced_sampling: true
    avoid_double_balance_correction: false
    # loss_type: focal (with or without alpha) underperformed plain class-weighted CE on the 4-way
    # head across two separate tests -- see model_config_tissue_region_camelyon_subtype_cls.yaml's
    # comment trail. Starting this config from the same proven-better ce baseline rather than
    # repeating that experiment here from scratch.
    loss_type: ce
    focal_gamma: 2.0
    focal_use_alpha: false

    optimizer:
      name: AdamW
      learning_rate: 0.0008
      weight_decay: 0.02
      momentum: 0.9
    scheduler:
      enabled: true
      name: ReduceLROnPlateau
      mode: max
      factor: 0.5
      patience: 5
    early_stopping:
      enabled: true
      patience: 10
      min_delta: 0.002
    fine_tuning:
      unfreeze_backbone_epoch: null
      fine_tune_lr: null
