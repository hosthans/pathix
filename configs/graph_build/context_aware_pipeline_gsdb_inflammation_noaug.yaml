# Like context_aware_pipeline_gsdb_inflammation.yaml, but without any augmentation
# (no stain_augment / gaussian_blur / jpeg_compression).
# Only deterministic Macenko color normalization is applied.
extends: ./context_aware_pipeline_gsdb_inflammation.yaml
graph_build:
  build:
    feature_transforms:
      - name: color_normalize
        method: macenko
        target_stats_path: configs/graph_build/reference_stats/gsdb_scanner1_lab.json
        macenko_rescale_concentration: false
    transform_seed: 42
