# Determinism check: identical copy of ../context_aware_gsdb_inflammation_noaug.yaml, built on GPU 1.
# Only the file name differs (= output dir name). Compare the two outputs with scripts/analysis/compare_graph_dirs.py.
# FLATTENED SNAPSHOT -- no `extends`, no `build_config`: every setting is written out here.
# Generated from  runtime: context_aware_gsdb_inflammation_noaug.yaml -> context_aware_runtime_gsdb.yaml -> simple_runtime_gsdb.yaml
#                 build:   context_aware_pipeline_gsdb_inflammation_noaug.yaml -> context_aware_pipeline_gsdb_inflammation.yaml -> context_aware_pipeline_gsdb.yaml -> context_aware_pipeline.yaml -> simple_pipeline.yaml
# Same effect as configs/graph_runtime/context_aware_gsdb_inflammation_noaug.yaml (verified field by field with build_graph._load_config).
# Build with: python -u src/entrypoint/build_graph.py --config <this file>. Flattened: do not edit; regenerate if the original changes.
graph_build:
  dataset: gsdb
  model: prov_gigapath
  seed: 42
  overwrite: false
  quiet_external_loggers: true
  worker_start_method: spawn
  worker_queue_maxsize: 1
  worker_result_poll_sec: 20
  worker_max_restarts_per_slide: 2
  graph_retry_attempts: 2
  csv: null
  csv_path: data/splits/gsdb/all_slides.csv
  slide_name_column: slide_name
  slide_dir: data/raw/slides
  visualize_each_graph: false
  build:
    pipeline: dynamical
    patch_level: 0
    patch_size: 256
    stride: 256
    k_patch: 12
    k_region: 5
    mask_enable_color_normalization: true
    mask_color_norm_strength: 0.65
    mask_use_adaptive_hsv: true
    mask_sat_percentile: 35.0
    mask_val_percentile: 99.0
    sat_min: 35.0
    val_max: 195.0
    tissue_frac_min: 0.08
    morph_kernel: 7.0
    min_component_area: 250.0
    mask_drop_border_components: true
    mask_border_margin_px: 16
    mask_require_core_connection_for_border_components: true
    mask_core_margin_px: 64
    feature_transforms:
    - name: color_normalize
      method: macenko
      target_stats_path: configs/graph_build/reference_stats/gsdb_scanner1_lab.json
      macenko_rescale_concentration: false
    transform_seed: 42
    target_patch_size_um: null
    auto_detect_target_patch_size_um: true
    feature_image_size: 224
    feature_batch_size: 1500
    feature_prep_workers: 4
    cv2_num_threads: 1
    blas_num_threads: 1
    feature_redundancy_check: true
    region_construction_mode: geometric
    geometric_max_patches_per_region: 100
  creation:
    annotation_type: geojson
    mask_type: slide
    use_annotations: true
    use_precomputed_mask: false
    annotations_dir: data/raw/annotations
    masks_dir: null
    node_creation_mode: patch_encoder
    patch_patch_edge_mode: semantic_equality
    region_region_edge_mode: knn
    cell_cell_edge_mode: knn
    build_slides_without_annotations: false
    filter_graph_with_annotations: false
    use_annotation_labels: true
    annotation_label_source: classification
    annotation_classification_field: inflammation_status
    build_slides_with_mismatched_annotations: false
    extra_annotation_classification_fields:
    - tissue_type
    label_fields:
    - name: status
      node_types:
      - region
      - patch
      - slide
      source: annotation_primary
      collapse: null
      slide_aggregation: majority_mixed
      mixed_threshold: 0.9
    - name: tissue_type
      node_types:
      - region
      - patch
      - slide
      source: annotation_extra
      extra_field: tissue_type
      collapse: null
      slide_aggregation: majority_mixed
      mixed_threshold: 0.9
